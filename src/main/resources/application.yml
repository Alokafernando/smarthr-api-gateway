server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-users
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - AuthenticationFilter
        - id: employee-service-employees
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/employees/**
          filters:
            - AuthenticationFilter
        - id: employee-service-departments
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/departments/**
          filters:
            - AuthenticationFilter
        - id: employee-service-positions
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/positions/**
          filters:
            - AuthenticationFilter
        - id: employee-service-attendance
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/attendance/**
          filters:
            - AuthenticationFilter
        - id: employee-service-leaves
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/leaves/**
          filters:
            - AuthenticationFilter
        - id: employee-service-salaries
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/salaries/**
          filters:
            - AuthenticationFilter
        - id: employee-service-dashboard
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/dashboard/**
          filters:
            - AuthenticationFilter
        - id: document-service-docs
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/documents/**
          filters:
            - AuthenticationFilter
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://smarthr-frontend-967905708839.asia-southeast1.run.app"
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: false
            maxAge: 3600

jwt:
  secret: ${JWT_SECRET:8d414e13c9cb1ccc8b88c38d4f3ec22f8318473a980d9134bda2d8d783d73bc7}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
